[loggers]
keys=root, console, file


[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=commonFormatter

[loggers_root]
level=DEBUG
handlers=consoleHandlers,fileHandler

[logger_console]
level=INDO
handlers=consoleHandler
qualname=console

[logger_file]
level=DEBUG
handlers=fileHandler
qualname=file
